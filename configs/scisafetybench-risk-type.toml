project_root = ".."
task = "scisafetybench_risk_type"
policy_file = "policies/scisafetybench-risk-type-v1.json"
run_dir = "runs/scisafetybench-risk-type-v1"
offline = false
# Configure only after documented approval; no approval is supplied by this preset.
# hosted_processing_approval_file = ".local/approvals/scisafetybench.json"

[data]
loader = "scisafetybench"
protocol = "challenge_eval"
directory = ".local/data/scisafetybench-risk-type-v1"
revision = "9db8659086fc7acc0be02f8087b189e6585cf1ea"
count = 80
seed = 42
similarity_threshold = 0.9

[budget]
ledger = ".local/state/pilot-budget.sqlite"
max_usd = 10.0
max_attempts = 500

[runner]
timeout_seconds = 60.0
retries = 2
max_retry_after_seconds = 60.0

[[models]]
name = "jev"
adapter = "decisions"
model = "typesafe/jev-1.14"
endpoint = "https://openrouter.ai/api/alpha/decisions"
api_key_env = "OPENROUTER_API_KEY"
# Same snapshot as the existing SciSafetyBench preset; re-check before live inference.
pricing_checked = "2026-10-19"
input_usd_per_million = 0.042
output_usd_per_million = 0.0
reservation_usd = 0.01
max_input_bytes = 32000
max_output_tokens = 256
